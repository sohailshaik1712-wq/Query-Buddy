version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querybuddy-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: querybuddy-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querybuddy-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
    ports:
      - "8000:8080"
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: querybuddy-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

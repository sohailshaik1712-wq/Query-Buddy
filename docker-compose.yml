services:
  db:
    image: pgvector/pgvector:pg16
    container_name: querybuddy-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-querybuddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-querybuddy}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querybuddy-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-querybuddy}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-me}
    depends_on:
      db:
        condition: service_healthy

  test-db:
    image: postgres:16-alpine
    container_name: querybuddy-test-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: sample_ecommerce
    volumes:
      - ./backend/seed_test_db.sql:/docker-entrypoint-initdb.d/seed.sql

volumes:
  postgres_data:
